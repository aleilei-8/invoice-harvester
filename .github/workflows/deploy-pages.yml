name: Deploy 代发助手手机版 to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (仅发布 dropship-web 目录)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dropship-web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
